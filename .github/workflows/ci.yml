name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported floor is Python 3.9 — the default macOS (Command Line
        # Tools) python3 ships a 3.9.x, and jig's helpers run on adopters'
        # python3, so the floor is verified here, not just on modern interpreters.
        # `actions/setup-python` no longer provides the exact old 3.9.6 patch for
        # current hosted runners (ubuntu-22.04/24.04), so we pin the 3.9 MINOR and
        # let it resolve the latest 3.9.x — patch releases don't change language /
        # stdlib compat. Keep `X | None` behind `from __future__ import
        # annotations` and avoid 3.10-only runtime APIs (e.g. zip(strict=)) so this
        # job stays green; `ruff target-version=py39` enforces the syntax floor.
        # We bracket the supported range — the 3.9 floor and the latest 3.x
        # (3.12) — rather than test every minor. 3.12 already exercises the
        # tomllib-gated (3.11+) code paths, so a middle 3.11 job is redundant.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure 'main' is a local branch
        # slice-land's land.py runs `git rev-parse --verify main` even in
        # dry-run mode (see ExecuteDryRunTests). On PRs, actions/checkout
        # leaves HEAD on the PR's branch and `main` is only available as
        # `origin/main` — the verify fails. Create a local `main` ref
        # pointing at origin/main so the test's preflight passes.
        run: |
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch main origin/main
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Skill-routing eval
        # spec 086: deterministic Tier-2 routing gate, run FIRST so a routing
        # regression fails *this named step* rather than the anonymous "Run test
        # suite" (which also enforces the floors via test_skill_routing.py). The
        # 0.85 floor mirrors skill_routing.MIN_RANK1_RATE (single source there;
        # ci_check.py imports it — a YAML step can't).
        run: python3 scripts/skill_routing.py --min-rank1 0.85

      - name: Run test suite
        run: python3 scripts/run_tests.py

      - name: Lint specs
        run: python3 scripts/spec_lint.py --all

      - name: Validate manifests
        run: python3 scripts/validate_manifests.py

      - name: Code-health floor (ruff)
        run: python3 skills/code-health/health.py check .

      - name: Host-package drift guard
        # spec 061-03 / ADR-0018: the committed hosts/claude and hosts/codex
        # packages must stay in sync with canonical source. The drift guard
        # regenerates into a scratch dir and diffs against the committed tree,
        # failing (with the stale path + regenerate command) when a PR edited
        # source without running `python3 scripts/build_host_packages.py`.
        run: python3 scripts/build_host_packages.py --check
